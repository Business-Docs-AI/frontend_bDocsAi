services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-BusinessDocsAi}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3333/api}
        VITE_API_TIMEOUT: ${VITE_API_TIMEOUT:-15000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped
